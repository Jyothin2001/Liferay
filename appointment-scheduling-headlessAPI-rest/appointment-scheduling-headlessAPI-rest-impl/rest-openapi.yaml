openapi: 3.0.1

info:
  title: "AppointmentSchedulingHeadless"
  version: v1.0
  description: "Headless REST API for managing appointments."
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

components:
  schemas:
    Appointment:
      description: "Represents an appointment entity in the Appointment Scheduling system."
      type: object
      properties:
        appointmentId:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userName:
          type: string
        createDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time
        doctorId:
          type: integer
          format: int64
        patientId:
          type: integer
          format: int64
        appointmentDate:
          type: string
          format: date-time
        timeSlot:
          type: string
        status:
          type: string
        message:
          type: object
          readOnly: true
        data:
          type: object

paths:
  "/appointments":
    get:
      operationId: getAppointments
      tags: ["Appointment"]
      summary: "Get all appointments"
      description: "Retrieve a list of all scheduled appointments."
      responses:
        '200':
          description: "Appointments listed successfully"
        '403':
          description: "No appointments found"
        '404':
          description: "API not found"

  "/appointments/add":
    post:
      operationId: addAppointment
      tags: ["Appointment"]
      summary: "Add a new appointment"
      description: "Create a new appointment entry in the system."
      requestBody:
        required: true
        description: "Appointment details to create"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appointment"
          application/xml:
            schema:
              $ref: "#/components/schemas/Appointment"
      responses:
        '200':
          description: "Appointment added successfully"
        '403':
          description: "Appointment not added"
        '404':
          description: "API not found"

  "/appointments/{appointmentId}":
    put:
      operationId: updateAppointment
      tags: ["Appointment"]
      summary: "Update an appointment"
      description: "Update details of an existing appointment by its ID."
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: "Updated appointment details"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appointment"
          application/xml:
            schema:
              $ref: "#/components/schemas/Appointment"
      responses:
        '200':
          description: "Appointment updated successfully"
        '403':
          description: "Appointment not found"
        '404':
          description: "API not found"

  "/appointments/delete":
    delete:
      operationId: deleteAppointment
      tags: ["Appointment"]
      summary: "Delete an appointment"
      description: "Delete an appointment from the system by its ID."
      parameters:
        - in: query
          name: appointmentId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Appointment deleted successfully"
        '403':
          description: "Appointment not found"
        '404':
          description: "API not found"
