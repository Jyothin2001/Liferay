openapi: 3.0.1

info:
  title: "AppointmentSchedulingHeadless"
  version: v1.0
  description: "Headless REST API for managing appointments."
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

components:
  schemas:
    Appointment:
      type: object
      description: "Represents an appointment record."
      properties:
        appointmentId:
          type: integer
          format: int64
        doctorId:
          type: integer
          format: int64
        patientId:
          type: integer
          format: int64
        appointmentDate:
          type: string
          format: date-time
        timeSlot:
          type: string
        status:
          type: string
        # Optional internal fields (hidden in Swagger)
        companyId:
          type: integer
          format: int64
          x-hidden: true
        userId:
          type: integer
          format: int64
          x-hidden: true
        userName:
          type: string
          x-hidden: true
        createDate:
          type: string
          format: date-time
          x-hidden: true
        modifiedDate:
          type: string
          format: date-time
          x-hidden: true
     
paths:
  "/appointments":
    get:
      operationId: getAppointments
      tags: ["Appointment"]
      summary: "Get all appointments"
      description: "Retrieve a list of all scheduled appointments."
      responses:
        '200':
          description: "Appointments listed successfully"
        '403':
          description: "No appointments found"
        '404':
          description: "API not found"

  "/appointments/add":
    post:
      operationId: addAppointment
      tags: ["Appointment"]
      summary: "Add a new appointment"
      description: "Create a new appointment entry in the system."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appointment"
          application/xml:
            schema:
              $ref: "#/components/schemas/Appointment"
      responses:
        '200':
          description: "Appointment added successfully"
        '403':
          description: "Appointment not added"
        '404':
          description: "API not found"

  "/appointments/{appointmentId}":
    put:
      operationId: updateAppointment
      tags: ["Appointment"]
      summary: "Update an appointment completely"
      description: "Replace an existing appointment with all new details."
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appointment"
          application/xml:
            schema:
              $ref: "#/components/schemas/Appointment"
      responses:
        '200':
          description: "Appointment updated successfully"
        '403':
          description: "Appointment not found"
        '404':
          description: "API not found"

    patch:
      operationId: patchAppointment
      tags: ["Appointment"]
      summary: "Partially update an appointment"
      description: "Update only specific fields (e.g., status, timeSlot) without replacing entire record."
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appointment"
          application/xml:
            schema:
              $ref: "#/components/schemas/Appointment"
      responses:
        '200':
          description: "Appointment patched successfully"
        '403':
          description: "Appointment not found"
        '404':
          description: "API not found"

  "/appointments/delete":
    delete:
      operationId: deleteAppointment
      tags: ["Appointment"]
      summary: "Delete an appointment"
      parameters:
        - name: appointmentId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Appointment deleted successfully"
        '403':
          description: "Appointment not found"
        '404':
          description: "API not found"
